[project]
name = "masteryloop-common"
version = "0.1.0"
description = "Shared database models, DAG validation, and Redis event bus contracts for MasteryLoop"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.1.18",
    "alembic>=1.13.1",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "redis[hiredis]>=5.0.4",
    "networkx>=3.3",
    "bcrypt>=4.1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/masteryloop_common"]
