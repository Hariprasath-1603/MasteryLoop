services:
  postgres:
    image: postgres:16-alpine
    container_name: masteryloop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-masteryloop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-masteryloop_secret}
      POSTGRES_DB: ${POSTGRES_DB:-masteryloop}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-masteryloop} -d ${POSTGRES_DB:-masteryloop}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: masteryloop-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --appendfsync everysec
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s

  qdrant:
    image: qdrant/qdrant:v1.9.2
    container_name: masteryloop-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.13.0
    container_name: masteryloop-mlflow
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      BACKEND_STORE_URI: postgresql://${POSTGRES_USER:-masteryloop}:${POSTGRES_PASSWORD:-masteryloop_secret}@postgres:5432/${POSTGRES_DB:-masteryloop}
      ARTIFACT_ROOT: /mlflow/artifacts
    command: >
      mlflow server
      --backend-store-uri postgresql://${POSTGRES_USER:-masteryloop}:${POSTGRES_PASSWORD:-masteryloop_secret}@postgres:5432/${POSTGRES_DB:-masteryloop}
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000
    volumes:
      - mlflow_data:/mlflow/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  mlflow_data:
